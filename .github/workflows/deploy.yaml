name: GitGub Action 기본 사용법 실습
 
# EVENT: 어느 시점에서 실행시킬지 실행되는 시점을 설정
# MAIN: 브랜치에 Push될 때 workflow를 실행
on: 
  push:
    branches:
      - main
      # - develop

# 하나의 workflow는 1개 이상의 job으로 구성
# 여러 job들은 기본적으로 병렬적으로 수행됨
jobs:
# job을 식별하기 위한 id
  My-develop-Job:
    # Github Aciton를 실행시킬 서버의 os 종류 선택
    # job은 여러 step들로 구성되고, 순차적으로 실행됨
    runs-on: ubuntu-latest
    steps:
      - name: Hello Wolrd 출력    # Step별 이름 지정
        run: echo "Hello World"   # 실제 실행시킬 명령어 작성